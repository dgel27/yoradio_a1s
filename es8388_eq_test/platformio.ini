; Standalone throwaway project for reverse-engineering the ES8388 DEQ
; (digital equalizer) shelving-filter coefficients, registers 30..37.
;
; It is deliberately OUTSIDE yoRadio/ so it can never affect the radio build.
; It shares the board definition and the ES8388 driver from yoRadio so the
; baseline init is identical to production.
;
; The DEQ coefficient encoding is not documented: the datasheet only gives the
; flat default {5'h0f, 5'h1f, 5'h0f, 5'h1f, 5'h0f, 5'h1f} and the user guide
; says the vendor has a calculator. So we discover it by ear: play a sine
; sweep with a candidate coefficient set, A/B against the flat default, and
; find which field produces a low- or high-shelf tilt.

[platformio]
default_envs = eqtest
; Reuse the radio's custom board definition (esp32-a1s) so the test builds
; with the same mcu/psram/flash settings as production.
boards_dir = ../yoRadio/boards

[env:eqtest]
platform = espressif32@^6.10.0
board = esp32-a1s
framework = arduino

board_build.filesystem = spiffs
board_build.partitions = partitions_eqtest.csv

monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Os

; The ES8388 driver is symlinked into src/ from ../yoRadio/src/audioES8388 so
; the test uses the exact same init code as the radio firmware, with no copy
; to drift out of sync.
build_src_filter = +<*>
