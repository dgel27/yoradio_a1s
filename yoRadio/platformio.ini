[platformio]
; Set a path to a cache folder
build_dir = _BUILD
libdeps_dir = _LIBDEPS
default_envs = Yoradio_RELEASE_serialPort


[env]
platform = espressif32@^6.10.0  ; latest: https://github.com/platformio/platform-espressif32/releases
board = esp32-a1s
framework = arduino
board_build.filesystem = spiffs ; littlefs
board_build.partitions = partition_1.75Mapp_OTA_0.375Mfs.csv

; monitor_port = COM84
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes

build_flags =
	-DCORE_DEBUG_LEVEL=2 ; Set to 0 for no debug - saves memory ; Set to 5 for full debug
	-Os

; IRremoteESP8266 is 84 translation units. It contributes no code to the image at
; all -- every use sits inside "#if IR_PIN!=255" and this project leaves IR_PIN
; at its 255 default -- but it is NOT free: the protocol tables and string
; literals add ~28KB of .rodata that --gc-sections cannot reclaim, and compiling
; it costs ~35s and 21MB of object files. Measured on this project: 249 -> 165
; translation units, 117s -> 82s, image 1570752 -> 1542624 bytes.
;
; !! If you set IR_PIN in myoptions.h to use a remote, DELETE the line below.
; !! Otherwise the library is missing from the build and the IR code will not link.
build_src_filter = +<*> -<IRremoteESP8266>

lib_deps = 
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; ================================================================================================================================
; ================================================================================================================================
; ================================================================================================================================

[env:Yoradio_RELEASE_serialPort]
; lib_ldf_mode = off  ; https://docs.platformio.org/en/latest/librarymanager/ldf.html
build_type = release
upload_protocol = esptool
upload_speed = 460800
upload_port = /dev/ttyUSB0

; ================================================================================================================================
; ================================================================================================================================
; ================================================================================================================================

[env:Yoradio_RELEASE_OTA]
build_type = release
upload_protocol = espota
upload_port = 10.11.12.13  ; IP address of the Radio


; ================================================================================================================================
; ================================================================================================================================
; ================================================================================================================================

[env:Yoradio_JLINK_debug]
build_type = debug

; https://docs.platformio.org/en/latest/plus/debug-tools/jlink.html
; https://docs.espressif.com/projects/esp-idf/en/v4.2/esp32/api-guides/jtag-debugging/index.html
; https://www.youtube.com/watch?v=psMqilqlrRQ
debug_tool = jlink   ; debug over j-link
debug_speed = 5000   ; clock frequency kHz
upload_protocol = jlink    ; use jlink also for program upload - comment for EspTool serial connection
debug_init_break = tbreak setup  ; stop at the beginning of the program

build_flags =
    ${env.build_flags}
    -D FREE_JTAG_PINS      ; reserve pins 12, 13, 14, 15 = skip initialization of the LCD

